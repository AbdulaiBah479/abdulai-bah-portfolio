# =====================================================================
# Bah.Digital AI OS - V1 core stack
#
# Start services ONE AT A TIME while learning (see docs/STEP-BY-STEP.md):
#   docker compose up -d postgres
#   docker compose up -d qdrant
#   ...
# Every port is bound to 127.0.0.1, so only your own computer can reach
# it. Nothing is exposed to the internet until we deliberately add a
# reverse proxy in a later phase.
#
# Image versions are pinned on purpose. We upgrade deliberately, after
# testing, instead of getting surprise changes.
# =====================================================================

name: bah

networks:
  bah-net:
    name: bah-net

volumes:
  postgres-data:
  qdrant-data:
  ollama-data:
  openwebui-data:
  n8n-data:

x-defaults: &defaults
  restart: unless-stopped
  networks: [bah-net]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:

  # ---- Step 4: main database -----------------------------------------
  postgres:
    <<: *defaults
    image: postgres:17.11
    container_name: bah-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
      LITELLM_DB_PASSWORD: ${LITELLM_DB_PASSWORD}
      TZ: ${TZ}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    ports: ["127.0.0.1:5432:5432"]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Step 5: vector memory -----------------------------------------
  qdrant:
    <<: *defaults
    image: qdrant/qdrant:v1.19.2
    container_name: bah-qdrant
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant-data:/qdrant/storage
    ports: ["127.0.0.1:6333:6333"]
    mem_limit: 1g

  # ---- Step 6: local AI models ---------------------------------------
  ollama:
    <<: *defaults
    image: ollama/ollama:0.35.1
    container_name: bah-ollama
    environment:
      OLLAMA_KEEP_ALIVE: 5m        # unload models after 5 min idle to free RAM
      OLLAMA_MAX_LOADED_MODELS: 1  # 8 GB laptop: one model in memory at a time
      OLLAMA_NUM_PARALLEL: 1
    volumes:
      - ollama-data:/root/.ollama
    ports: ["127.0.0.1:11434:11434"]
    mem_limit: 4g
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---- Step 7: chat interface ----------------------------------------
  open-webui:
    <<: *defaults
    image: ghcr.io/open-webui/open-webui:v0.11.4
    container_name: bah-open-webui
    depends_on:
      ollama: { condition: service_started }
      qdrant: { condition: service_started }
    environment:
      WEBUI_NAME: Bah.Digital AI
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      OLLAMA_BASE_URL: http://ollama:11434
      # After Step 9 the gateway appears here too, so you can chat with
      # every model (local + free cloud) from one screen.
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      VECTOR_DB: qdrant
      QDRANT_URI: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      ENABLE_SIGNUP: "true"   # first account becomes admin; turn off after
      SCARF_NO_ANALYTICS: "true"
      DO_NOT_TRACK: "true"
      ANONYMIZED_TELEMETRY: "false"
    volumes:
      - openwebui-data:/app/backend/data
    ports: ["127.0.0.1:3000:8080"]
    mem_limit: 1536m

  # ---- Step 8: automation engine -------------------------------------
  # License note: n8n uses the Sustainable Use License. Using it for your
  # own business and building workflows for clients is fine. Reselling
  # hosted n8n itself as your SaaS product is NOT - see docs/LICENSING.md.
  n8n:
    <<: *defaults
    image: n8nio/n8n:2.42.4
    container_name: bah-n8n
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: ${TZ}
      TZ: ${TZ}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"     # only OK because it is localhost-only
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    volumes:
      - n8n-data:/home/node/.n8n
    ports: ["127.0.0.1:5678:5678"]
    mem_limit: 1g

  # ---- Step 9: AI gateway / model router -----------------------------
  litellm:
    <<: *defaults
    image: ghcr.io/berriai/litellm:main-v1.83.14-stable
    container_name: bah-litellm
    depends_on:
      postgres: { condition: service_healthy }
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD}@postgres:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      STORE_MODEL_IN_DB: "False"
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    volumes:
      - ./config/litellm/config.yaml:/app/config.yaml:ro
    ports: ["127.0.0.1:4000:4000"]
    mem_limit: 1g
